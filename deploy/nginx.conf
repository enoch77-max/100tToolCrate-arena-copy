# Install as /etc/nginx/sites-available/100toolcrate, then run Certbot.
# Certbot adds the HTTPS listener and HTTP-to-HTTPS redirect after validation.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 16k;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never proxy hidden files or operational directories from a misconfigured alias.
    location ~ /\.(?!well-known) { return 404; }
    location ~* ^/(?:backend|data|backups|content|scripts|deploy|node_modules)(?:/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_hide_header X-Powered-By;
    }
}
